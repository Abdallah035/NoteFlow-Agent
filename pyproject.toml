[project]
name = "noteflow"
version = "0.1.0"
description = "A conversational note-taking agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-genai>=2.0.1",
    "pydantic>=2.13.4",
    "fastapi>=0.115.5",
    "uvicorn>=0.40.0",
    "python-dotenv>=1.0.1",
    "numpy>=2.1.3",
    "qdrant-client>=1.18.0",
]

[project.optional-dependencies]
# Semantic search. Kept separate because it pulls in torch, which is a big
# download. The app works fine without it.
embeddings = [
    "sentence-transformers>=3.0.0",
]

# Optional vector store. SQLite is the default and is fine for this size;
# Chroma is here to show the path when the note count grows.
vectordb = [
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[project.scripts]
noteflow = "noteflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noteflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
